<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C96442" />
    <meta name="description" content="ISUP · Instituto Superior Universitario Privado. Carreras técnicas 100% virtuales con aula virtual propia." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ISUP · Aula Virtual</title>
    <script>
      try {
        var t = localStorage.getItem('isup_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
